<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Básico -->
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <!-- Viewport (crítico para mobile-first) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#137cff">

  <!-- SEO -->
  <title>Asesoría en Banca | Política de privacidad</title>
  <meta name="description" content="Políticas de protección de datos e información de nuestros clientes.">

  <!-- Canonical -->
  <link rel="canonical" href="https://www.asesoriaenbanca.com/">

  <!-- Favicon (luego lo ajustas) -->
  <link rel="icon" href="/favicon.ico">

  <!-- Open Graph (social) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Asesoría en Banca">
  <meta property="og:description" content="Políticas de privacidad de los datos y la información de nuestros clientes.">
  <meta property="og:url" content="https://www.asesoriaenbanca.com/">
  <meta property="og:image" content="https://www.asesoriaenbanca.com/og-image.jpg">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
            <!-- Header -->
  <header data-include="partials/menu.html"></header>

  <!-- Contenido principal -->
  <main>
      <section id="cotiza-header">
    
    </section>
    <div class="contenido">
      <p class="n justify pb-20">Bríndanos tu información y te enviaremos una cotización personalizada lo antes posible. Nuestro equipo se pondrá en contacto contigo para resolver tus dudas y ofrecerte la mejor solución.</p>
      <div class="form-content pt-20">
  <form id="leadForm" novalidate>
  <!-- Nombre completo -->
  <div class="form-group">
    <label for="fullName">Nombre completo *</label>
    <input type="text" id="fullName" name="fullName" required>
    <span class="error-message"></span>
  </div>

  <!-- Fecha de nacimiento -->
  <div class="form-group">
    <label for="birthDate">Fecha de nacimiento</label>
    <input type="date" id="birthDate" name="birthDate">
    <span class="error-message"></span>
  </div>

  <!-- Teléfono -->
  <div class="form-group">
    <label for="phone">Número de teléfono *</label>
    <input type="tel" id="phone" name="phone" required>
    <span class="error-message"></span>
  </div>

  <!-- Correo -->
  <div class="form-group">
    <label for="email">Correo *</label>
    <input type="email" id="email" name="email" required>
    <span class="error-message"></span>
  </div>

  <!-- Labora en (select) -->
  <div class="form-group">
    <label for="workOption">Sector Laboral *</label>
    <select id="workOption" name="workOption" required>
      <option value="">-- Selecciona --</option>
      <option value="Opción 1">Empresa privada</option>
      <option value="Opción 2">Gobierno</option>
      <option value="Opción 3">Jubilado</option>
    </select>
    <span class="error-message"></span>
  </div>

  <!-- Lugar de trabajo -->
  <div class="form-group">
    <label for="workplace">Lugar de trabajo</label>
    <input type="text" id="workplace" name="workplace">
    <span class="error-message"></span>
  </div>

  <!-- Tiempo en la empresa -->
  <div class="form-group">
    <label for="timeInCompany">Tiempo en la empresa</label>
    <input type="text" id="timeInCompany" name="timeInCompany">
    <span class="error-message"></span>
  </div>

  <!-- Referencias afectadas -->
  <div class="form-group">
    <label>Referencias afectadas *</label>
    <div>
      <label><input type="radio" name="affectedRefs" value="Sí" required> Sí</label>
      <label><input type="radio" name="affectedRefs" value="No"> No</label>
    </div>
    <span class="error-message"></span>
  </div>

  <!-- Archivos -->
  <div class="form-group">
    <label for="files">Subir archivos</label>
    <input type="file" id="files" name="files" multiple>
    <span class="error-message"></span>
  </div>

  <!-- Comentarios -->
  <div class="form-group">
    <label for="comments">Comentarios</label>
    <textarea id="comments" name="comments" rows="3"></textarea>
    <span class="error-message"></span>
  </div>

  <button type="submit">Enviar</button>

  <!-- Mensaje general -->
  <div id="form-status"></div>
  </div>
</form>
</div>
  </main>
  <div data-include="partials/scroll.html"></div>

<!-- BOTÓN STICKY CONTACTO -->
<button id="contact-toggle" aria-label="Contacto">
  <!-- icono chat -->
  <svg viewBox="0 0 24 24" aria-hidden="true">
  <rect x="3" y="5" width="18" height="14" rx="2"
        fill="none" stroke="currentColor" stroke-width="1"/>
  <circle cx="8" cy="11" r="2"
          fill="none" stroke="currentColor" stroke-width="1"/>
  <path d="M4 17c1.5-2 6.5-2 8 0"
        fill="none" stroke="currentColor" stroke-width="1"/>
  <path d="M13 9h6M13 13h6"
        stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
</svg>
</button>

<!-- POPUP CONTACTO -->
<div id="contact-panel" data-include="partials/contact-panel.html"></div>

  <!-- Footer -->
  <footer data-include="partials/footer.html"></footer>
  
<script src="includes.js" defer></script>
<script src="script.js" defer></script>

</body>
</html>
