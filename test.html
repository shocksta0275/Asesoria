<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba Make</title>
</head>
<body>
  <h1>Prueba de Envío a Make</h1>
  <button id="sendBtn">Enviar JSON de prueba</button>
  <div id="status" style="margin-top:1rem;"></div>

  <script>
    const MAKE_WEBHOOK_URL = 'https://hook.us2.make.com/25mdw2k21j8ft5kxeafr08qv10ufir1h';
    const status = document.getElementById('status');
    const btn = document.getElementById('sendBtn');

    btn.addEventListener('click', async () => {
      const testData = { mensaje: "¡Hola Make!", timestamp: new Date().toISOString() };
      status.textContent = "Enviando...";
      status.style.color = "blue";

      try {
        const response = await fetch(MAKE_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(testData)
        });

        if (response.ok) {
          status.textContent = "Datos enviados correctamente.";
          status.style.color = "green";
        } else {
          status.textContent = "Error en el envío.";
          status.style.color = "red";
        }
      } catch (err) {
        status.textContent = "No se pudo conectar con Make.";
        status.style.color = "red";
        console.error(err);
      }
    });
  </script>
</body>
</html>
