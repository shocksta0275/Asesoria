<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Prueba Make</title>
</head>
<body>
<h2>Formulario de prueba</h2>
<form id="leadForm">
  <input type="text" name="fullName" placeholder="Nombre completo" required>
  <input type="email" name="email" placeholder="Correo" required>
  <input type="tel" name="phone" placeholder="Teléfono" required>
  <button type="submit">Enviar</button>
</form>

<div id="form-status"></div>

<script>
document.getElementById('leadForm').addEventListener('submit', async e => {
  e.preventDefault();

  const payload = {
    fullName: "Juan Pérez",
    email: "juan@example.com",
    phone: "+50712345678"
  };

  document.getElementById('form-status').textContent = 'Enviando...';

  try {
    const res = await fetch('https://hook.us2.make.com/25mdw2k21j8ft5kxeafr08qv10ufir1h', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (res.ok) {
      document.getElementById('form-status').textContent = '¡Enviado correctamente!';
    } else {
      document.getElementById('form-status').textContent = 'Error en el envío.';
    }
  } catch (err) {
    document.getElementById('form-status').textContent = 'No se pudo conectar.';
    console.error(err);
  }
});
</script>
</body>
</html>
